<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Connect Google Drive</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 40px auto; padding: 20px; }
    input { width: 100%; padding: 8px; margin: 8px 0; }
    button { background: #4285f4; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background: #3367d6; }
    .hint { color: #666; font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Connect Google Drive</h1>
  <p>If the Supabase page shows raw HTML, use this local page instead.</p>
  <label>Client ID (from Google Cloud Console):</label>
  <input type="text" id="clientId" placeholder="xxx.apps.googleusercontent.com">
  <button onclick="connect()">Connect Google Drive</button>
  <p class="hint">Paste your OAuth Client ID, then click. You'll be redirected to Google to authorize. After that, you'll get the refresh token.</p>
  <script>
    const REDIRECT_URI = 'https://nhbiyqebcveqjoxxnytm.supabase.co/functions/v1/oauth-drive';
    const SCOPE = 'https://www.googleapis.com/auth/drive.file';
    function connect() {
      const clientId = document.getElementById('clientId').value.trim();
      if (!clientId) { alert('Enter Client ID'); return; }
      const params = new URLSearchParams({
        client_id: clientId,
        redirect_uri: REDIRECT_URI,
        response_type: 'code',
        scope: SCOPE,
        access_type: 'offline',
        prompt: 'consent',
      });
      window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
    }
  </script>
</body>
</html>
